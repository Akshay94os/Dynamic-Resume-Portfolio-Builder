<!DOCTYPE html>
<html>
<head><title>Build Resume</title><style>body{font-family:sans-serif;padding:2rem;background:#0f172a;color:#fff;}input,textarea{width:100%;margin-bottom:8px;padding:8px;background:#1e293b;border:1px solid #334155;color:#fff;}button{background:#0284c7;color:#fff;padding:10px 20px;border:none;cursor:pointer;}</style></head>
<body>
  <h1>Resume Generator</h1>
  <form method="POST">
    {% csrf_token %}
    <input name="name" placeholder="Full Name" required>
    <input name="title" placeholder="Professional Title (e.g. Software Engineer)" required>
    <input name="email" type="email" placeholder="Email" required>
    <input name="phone" placeholder="Phone Number" required>
    <textarea name="summary" placeholder="Professional Bio/Summary"></textarea>
    <input name="skills" placeholder="Skills (comma separated: Python, Django, Docker)">
    <textarea name="experience" placeholder="Work History & Experience Details"></textarea>
    <button type="submit">Generate Resume</button>
  </form>
</body>
</html>
